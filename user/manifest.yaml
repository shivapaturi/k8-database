apiVersion: v1
kind: ConfigMap

metadata:
  name: user
  namespace: roboshop
  labels:
    component: user
    project: roboshop
    tier: app
data:
  MONGO: "true" 
  MONGO_URL: "mongodb://mongodb:27017/user"
  REDIS_URL: "redis://redis:6379"

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: user
  namespace: roboshop
  # Deployment labels
  labels:
    component: user
    project: roboshop
    tier: app

spec:
  replicas: 1

  # These labels are used by ReplicaSet to select Pods.
  # They must match the Pod template labels.
  selector:
    matchLabels:
      component: user
      project: roboshop
      tier: app

  # Pod definition
  template:
    metadata:
      labels:
        component: user
        project: roboshop
        tier: app

    spec:
      containers:
        - name: user
          image: shivapaturi01/user:v1
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          envFrom:
          - configMapRef:
              name: user

---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: roboshop
  labels:
      component: user
      project: roboshop
      tier: app

spec:
  selector:
      component: user
      project: roboshop
      tier: app

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user
  namespace: roboshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user         # must match your Deployment's name
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 10